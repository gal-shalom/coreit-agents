name: Blog Writer

# Publishes one SEO blog post to coreit.hashnode.dev. Runs weekly, and can be
# triggered by hand from the Actions tab. Nothing else in the repo scheduled
# this agent before, so it never actually ran.
on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC
  workflow_dispatch: {}

# Never let two publish runs overlap.
concurrency:
  group: blog-writer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Write & publish post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HASHNODE_API_KEY: ${{ secrets.HASHNODE_API_KEY }}
        run: npm run blog
